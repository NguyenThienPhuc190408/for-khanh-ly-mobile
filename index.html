<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>For Khanh Ly</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Dancing+Script:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
      /* Fix cho iPhone: không cho cuộn trang, không cho kéo giật trang (rubber-banding) */
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: manipulation;
      }

      body {
        font-family: "Be Vietnam Pro", sans-serif;
        background: linear-gradient(135deg, #fff5f5 0%, #ffe4e6 100%);
        perspective: 1200px;
      }

      .title-font {
        font-family: "Dancing Script", cursive;
      }

      .glow-effect {
        box-shadow: 0 0 20px rgba(251, 113, 133, 0.4);
        animation: pulseGlow 2s infinite;
      }

      @keyframes pulseGlow {
        0%,
        100% {
          box-shadow: 0 0 15px rgba(251, 113, 133, 0.4);
        }
        50% {
          box-shadow: 0 0 30px rgba(251, 113, 133, 0.8);
        }
      }

      .petal-item {
        position: absolute;
        pointer-events: none;
        z-index: 1;
      }
      .butterfly-container {
        position: absolute;
        width: 40px;
        height: 40px;
        pointer-events: none;
        z-index: 99;
        transform-style: preserve-3d;
      }
      .butterfly-wings {
        width: 100%;
        height: 100%;
        display: flex;
        position: relative;
        transform-style: preserve-3d;
      }

      .wing-l,
      .wing-r {
        width: 20px;
        height: 28px;
        border-radius: 50% 50% 10% 50%;
        transform-origin: right center;
        animation: flap-l 0.12s infinite ease-in-out alternate;
      }
      .wing-r {
        border-radius: 50% 50% 50% 10%;
        transform-origin: left center;
        animation: flap-r 0.12s infinite ease-in-out alternate;
      }

      @keyframes flap-l {
        0% {
          transform: rotateY(0deg);
        }
        100% {
          transform: rotateY(70deg);
        }
      }
      @keyframes flap-r {
        0% {
          transform: rotateY(0deg);
        }
        100% {
          transform: rotateY(-70deg);
        }
      }

      .resting-butterfly {
        position: absolute;
        width: 30px;
        height: 30px;
        pointer-events: none;
        z-index: 40;
        transform-style: preserve-3d;
      }
      .resting-wings {
        width: 100%;
        height: 100%;
        display: flex;
        position: relative;
        transform-style: preserve-3d;
      }
      .resting-wing-l,
      .resting-wing-r {
        width: 15px;
        height: 21px;
        border-radius: 50% 50% 10% 50%;
        transform-origin: right center;
        animation: flap-resting-l 5s infinite ease-in-out;
      }
      .resting-wing-r {
        border-radius: 50% 50% 50% 10%;
        transform-origin: left center;
        animation: flap-resting-r 5s infinite ease-in-out;
      }

      @keyframes flap-resting-l {
        0%,
        75%,
        100% {
          transform: rotateY(0deg);
        }
        80% {
          transform: rotateY(65deg);
        }
        83% {
          transform: rotateY(15deg);
        }
        86% {
          transform: rotateY(60deg);
        }
        89% {
          transform: rotateY(10deg);
        }
        92% {
          transform: rotateY(55deg);
        }
      }
      @keyframes flap-resting-r {
        0%,
        75%,
        100% {
          transform: rotateY(0deg);
        }
        80% {
          transform: rotateY(-65deg);
        }
        83% {
          transform: rotateY(-15deg);
        }
        86% {
          transform: rotateY(-60deg);
        }
        89% {
          transform: rotateY(-10deg);
        }
        92% {
          transform: rotateY(-55deg);
        }
      }

      .buff-text {
        position: absolute;
        pointer-events: none;
        font-weight: 800;
        z-index: 100;
        text-shadow: 0 4px 12px rgba(0, 0, 0, 0.15);
        white-space: nowrap;
        will-change: transform, opacity;
      }
    </style>
  </head>
  <body
    class="w-full h-full flex flex-col justify-center items-center relative overflow-hidden"
  >
    <div
      id="petal-container"
      class="absolute inset-0 pointer-events-none overflow-hidden"
    ></div>

    <!-- TRANG 1 -->
    <div
      class="relative z-10 max-w-sm w-11/12 bg-white/60 backdrop-blur-md p-6 md:p-12 rounded-3xl border border-white/80 shadow-xl shadow-rose-100 text-center opacity-0 transform translate-y-10"
      id="main-card"
    >
      <div class="flex justify-center mb-6">
        <div class="w-16 h-16 animate-bounce duration-1000">
          <svg viewBox="0 0 100 100" class="w-full h-full drop-shadow-md">
            <g transform="translate(50,50)">
              <path
                d="M 0 0 C -25 -25, -40 -10, -30 10 C -20 30, 0 10, 0 0"
                fill="#10B981"
              />
              <path
                d="M 0 0 C -25 25, -10 40, 10 30 C 30 20, 10 0, 0 0"
                fill="#059669"
              />
              <path
                d="M 0 0 C 25 25, 40 10, 30 -10 C 20 -30, 0 -10, 0 0"
                fill="#34D399"
              />
              <path
                d="M 0 0 C 25 -25, 10 -40, -10 -30 C -30 -20, -10 0, 0 0"
                fill="#059669"
              />
              <path
                d="M 0 0 Q -5 25, -15 35"
                stroke="#047857"
                stroke-width="4"
                fill="none"
                stroke-linecap="round"
              />
            </g>
          </svg>
        </div>
      </div>
      <h1
        class="title-font text-4xl font-bold text-rose-500 mb-6 tracking-wide"
      >
        For Khanh Ly
      </h1>
      <button
        id="btn-surprise"
        class="glow-effect group relative px-8 py-4 rounded-full bg-gradient-to-r from-rose-400 to-pink-500 text-white font-semibold tracking-wider text-sm overflow-hidden shadow-lg transition-transform duration-300 hover:scale-105 active:scale-95 cursor-pointer"
      >
        <span class="relative z-10 flex items-center justify-center gap-2"
          >BẤM VÀO ĐÂY ĐI BÀ NẬU..</span
        >
      </button>
    </div>

    <!-- TRANG 2 -->
    <div
      id="challenge-card"
      class="hidden absolute z-25 max-w-sm w-11/12 bg-white/75 backdrop-blur-lg p-6 rounded-3xl border border-rose-100 shadow-2xl text-center opacity-0 transform scale-90"
    >
      <div class="flex justify-center mb-4 text-4xl">📑</div>
      <h2 class="title-font text-2xl text-rose-500 font-bold mb-4">
        ✨Gói BUFF sức mạnh✨
      </h2>
      <button
        id="btn-agree"
        class="px-8 py-3 rounded-full bg-gradient-to-r from-emerald-400 to-teal-500 text-white font-medium shadow-md hover:scale-105 active:scale-95 transition-transform cursor-pointer z-10 w-full"
      >
        Bấm để nhận Buff
      </button>
    </div>

    <!-- TRANG 3 -->
    <div
      id="envelope-section"
      class="hidden absolute z-20 flex flex-col items-center justify-center text-center w-full max-w-xs px-4"
    >
      <h2
        id="open-text"
        class="title-font text-3xl text-rose-500 font-bold mb-8 opacity-0"
      >
        Mở thư ra đi... ✉️
      </h2>
      <div class="relative w-64 h-48 mx-auto opacity-0" id="envelope-container">
        <div
          id="envelope"
          class="relative w-full h-full cursor-pointer transition-transform duration-500 hover:scale-105"
        >
          <div
            class="absolute inset-0 bg-white border border-rose-100 rounded-2xl overflow-hidden shadow-lg flex items-center justify-center"
          >
            <svg
              class="absolute inset-0 w-full h-full"
              viewBox="0 0 320 224"
              fill="none"
            >
              <path
                d="M0 0 L160 112 L0 224 Z"
                fill="#FFF0F3"
                stroke="#FCE2E7"
                stroke-width="1.5"
              />
              <path
                d="M320 0 L160 112 L320 224 Z"
                fill="#FFF0F3"
                stroke="#FCE2E7"
                stroke-width="1.5"
              />
              <path
                d="M0 224 L160 112 L320 224 Z"
                fill="#FFE3E8"
                stroke="#FCDBE2"
                stroke-width="1.5"
              />
            </svg>
            <div
              id="envelope-seal"
              class="absolute z-30 w-12 h-12 bg-gradient-to-tr from-emerald-400 to-teal-500 rounded-full flex items-center justify-center shadow-md border-2 border-white"
            ></div>
          </div>
          <div
            id="envelope-flap"
            class="absolute top-0 left-0 w-full h-24 origin-top z-20 transition-transform duration-700 ease-in-out"
            style="transform-style: preserve-3d"
          >
            <svg class="w-full h-full" viewBox="0 0 320 112" fill="none">
              <path
                d="M0 0 L160 112 L320 0 Z"
                fill="#FFCCD5"
                stroke="#FBB5C1"
                stroke-width="1.5"
              />
            </svg>
          </div>
        </div>
      </div>
    </div>

    <!-- TRANG 4 -->
    <div
      id="letter-section"
      class="hidden absolute z-30 max-w-xs w-11/12 bg-[#FFFDFE] border border-rose-100 rounded-3xl p-6 shadow-2xl text-center opacity-0 transform translate-y-10"
    >
      <h2 class="title-font text-3xl text-rose-500 font-bold mb-4">
        Chúc Ly thi tốt! 🍀
      </h2>
      <div
        class="text-rose-900/80 text-sm leading-relaxed font-light text-justify space-y-3 mb-6 max-h-[200px] overflow-y-auto pr-2"
      >
        <p>
          Phúc chúc Ly thi cử thuận lợi, làm bài trơn tru, thi như cá gặp nước,
          không vướng câu nào khó, điểm cao chót vót đỗ thẳng nguyện vọng 1, đạt
          được kết quả hơn cả mong đợi.
        </p>
        <p
          class="text-center text-xl font-black text-rose-600 mt-4 uppercase tracking-widest"
        >
          THƯỢNG LỘ BÌNH AN!
        </p>
      </div>
      <div class="text-right">
        <p class="title-font text-xl text-rose-500 font-semibold">
          By Nguyen Thien Phuc
        </p>
      </div>
    </div>

    <script>
      const container = document.getElementById("petal-container");
      function createFallingObject() {
        const obj = document.createElement("div");
        obj.classList.add("petal-item");
        obj.style.left = `${Math.random() * 100}vw`;
        obj.style.top = `-30px`;
        container.appendChild(obj);
        gsap.to(obj, {
          y: "105vh",
          rotation: Math.random() * 360,
          duration: Math.random() * 7 + 6,
          ease: "none",
          onComplete: () => {
            obj.remove();
            createFallingObject();
          },
        });
      }
      for (let i = 0; i < 20; i++) {
        setTimeout(createFallingObject, Math.random() * 7000);
      }

      window.addEventListener("DOMContentLoaded", () => {
        gsap.to("#main-card", {
          opacity: 1,
          y: 0,
          duration: 1.5,
          ease: "power4.out",
        });
      });

      document.getElementById("btn-surprise").addEventListener("click", () => {
        gsap.to("#main-card", {
          opacity: 0,
          scale: 0.8,
          y: -50,
          duration: 1,
          onComplete: () => {
            document.getElementById("main-card").classList.add("hidden");
            document
              .getElementById("challenge-card")
              .classList.remove("hidden");
            gsap.to("#challenge-card", { opacity: 1, scale: 1, duration: 1 });
          },
        });
      });

      function spawnBuffs() {
        for (let i = 0; i < 15; i++) {
          const b = document.createElement("div");
          b.className = "buff-text";
          b.innerText = ["+1000% Tự Tin 🔥", "Đỗ NV1 🎯", "Ông bà độ 🐢"][
            Math.floor(Math.random() * 3)
          ];
          b.style.left = Math.random() * 100 + "vw";
          b.style.top = "-50px";
          b.style.color = "#fb7185";
          document.body.appendChild(b);
          gsap.to(b, {
            y: "110vh",
            duration: 3 + Math.random() * 2,
            onComplete: () => b.remove(),
          });
        }
      }

      document.getElementById("btn-agree").addEventListener("click", () => {
        spawnBuffs();
        document.getElementById("challenge-card").classList.add("hidden");
        document.getElementById("envelope-section").classList.remove("hidden");
        gsap.fromTo(
          "#envelope-container",
          { opacity: 0 },
          { opacity: 1, duration: 1 },
        );
        gsap.to("#open-text", { opacity: 1, duration: 1 });
      });

      document.getElementById("envelope").addEventListener("click", () => {
        gsap.to("#envelope-flap", { rotateX: 180, duration: 0.8 });
        // BÃO BƯỚM (Duy trì số lượng lớn)
        for (let i = 0; i < 50; i++) {
          const b = document.createElement("div");
          b.className = "butterfly-container";
          b.style.left = "50vw";
          b.style.top = "50vh";
          b.innerHTML =
            '<div class="butterfly-wings"><div class="wing-l" style="background:#fb7185"></div><div class="wing-r" style="background:#fb7185"></div></div>';
          document.body.appendChild(b);
          gsap.to(b, {
            x: (Math.random() - 0.5) * 1000,
            y: (Math.random() - 0.5) * 1000,
            duration: 2 + Math.random(),
            onComplete: () => b.remove(),
          });
        }
        setTimeout(() => {
          document.getElementById("envelope-section").classList.add("hidden");
          document.getElementById("letter-section").classList.remove("hidden");
          gsap.to("#letter-section", { opacity: 1, y: 0, duration: 1 });
        }, 1000);
      });
    </script>
  </body>
</html>
